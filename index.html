<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>단어정원</title>
<meta name="description" content="엑셀 단어장으로 매일 10분, 영어 단어를 키우는 정원">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단어정원">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2A2226" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 손으로 쓰는 세로 화면. 위에는 오늘 할 일 하나, 아래에는 엄지 닿는 탭 바. 손그림 스티커처럼 진한 테두리와 파스텔 면. */
:root{
  --bg:#FFF5F7; --surface:#FFFFFF; --sunken:#FCE8ED; --ink:#4D3B3B; --muted:#8A7070; --line:#F3D8DE; --stroke:#4D3B3B;
  --leaf:#86E0C3; --leaf-soft:#DBF6EC; --on-leaf:#263F37; --leaf-text:#178562;
  --sun:#FFD873; --sun-soft:#FFF3CC; --on-sun:#54400A;
  --berry:#FF9DB0; --berry-soft:#FFE4EA; --berry-text:#C43E5E;
  --sky:#8EC9F8; --sky-soft:#E2F1FF; --sky-text:#2B78BD; --lilac-soft:#F0EAFF;
  --f-display:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --f-word:'Nunito','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --r:24px; --bw:2.5px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#2A2226; --surface:#392F34; --sunken:#201A1D; --ink:#FBEFF1; --muted:#C4AEB5; --line:#54454C; --stroke:#141012;
    --leaf:#74D6B6; --leaf-soft:#2E4A42; --on-leaf:#12302A; --leaf-text:#8FE8CB;
    --sun:#FFD873; --sun-soft:#4B4023; --on-sun:#4A3606;
    --berry:#FF9DB0; --berry-soft:#52323C; --berry-text:#FFB0C0;
    --sky:#8EC9F8; --sky-soft:#2C4054; --sky-text:#A6D5FB; --lilac-soft:#3A3350;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overscroll-behavior-y:none;word-break:keep-all;overflow-wrap:anywhere}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.row{display:flex;align-items:center;gap:10px} .row>.grow{flex:1;min-width:0} .wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.num{font-variant-numeric:tabular-nums}

/* 캐릭터 */
.mascot{display:block;flex:none;overflow:visible}
.buddy-img{display:block;flex:none;object-fit:contain;border-radius:18px}
.bob{animation:bob 2.6s ease-in-out infinite;flex:none}
.yay{animation:hop .55s ease-out}
.oops{animation:wob .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.06)}70%{transform:translateY(0) scale(.97)}100%{transform:none}}
@keyframes wob{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.say{position:relative;background:var(--surface);border:var(--bw) solid var(--stroke);border-radius:18px;padding:9px 14px;font-weight:700;font-size:15px}
.say::after{content:"";position:absolute;right:34px;top:-9px;width:14px;height:14px;background:var(--surface);
  border-left:var(--bw) solid var(--stroke);border-top:var(--bw) solid var(--stroke);transform:rotate(45deg)}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pals button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:20px;background:var(--sunken);border:var(--bw) solid transparent}
.pals button.on{background:var(--sun-soft);border-color:var(--stroke);box-shadow:0 3px 0 var(--stroke)}
.pals b{font-family:var(--f-display);font-weight:400;font-size:16px}

/* 카드 */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:19px}
.section-title{font-size:17px;margin-top:6px}

/* 버튼: 스티커처럼 테두리가 있는 두툼한 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;
  font-family:var(--f-display);font-size:18px;background:var(--leaf);color:var(--on-leaf);border:var(--bw) solid var(--stroke);box-shadow:0 4px 0 var(--stroke);
  transition:transform .06s,box-shadow .06s;width:100%;text-align:center;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn.danger{background:var(--berry);color:#4D2630}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;width:auto;box-shadow:0 3px 0 var(--stroke);border-width:2px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--leaf-text);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:8px 4px}

/* 머리말 */
.top{display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--sun-soft);border:2px solid var(--stroke);display:grid;place-items:center;font-size:26px;flex:none;overflow:hidden}
.avatar.lg{width:76px;height:76px;font-size:40px}
.avatar img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--sunken);font-weight:700;font-size:14px;white-space:nowrap}
.chip.fire{background:var(--sun-soft);color:var(--on-sun)}
@media (prefers-color-scheme: dark){.chip.fire{color:var(--sun)}}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf-text)}
.chip.sky{background:var(--sky-soft);color:var(--sky-text)}
.xpbar{height:12px;border-radius:99px;background:var(--sunken);overflow:hidden}
.xpbar>i{display:block;height:100%;border-radius:99px;background:var(--sun);transition:width .5s}
.xpbar.leaf>i{background:var(--leaf)}

/* 오늘의 학습 */
.today{background:var(--leaf-soft);border:var(--bw) solid var(--stroke);box-shadow:0 4px 0 var(--stroke);display:flex;flex-direction:column;gap:12px}
.today h2{font-size:24px;line-height:1.25}
.today .deckname{font-weight:700;font-size:14px;color:var(--leaf-text)}
.today .plan{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.today .plan span{background:var(--surface);border:2px solid var(--stroke);border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px}
.today .link{color:var(--ink);display:block;margin:0 auto;padding:2px 4px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--sun) calc(var(--p)*1%),var(--sunken) 0)}
.ring>span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:13px}

/* 정원 단계 */
.garden{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.garden div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 2px;text-align:center}
.garden b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.garden span{font-size:11px;color:var(--muted)}
.garden .e{font-size:22px;line-height:1.2}

/* 탭 바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 7px;font-size:11px;font-weight:700;color:var(--muted)}
.tabbar button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--leaf-text)}
.tabbar button[aria-current="page"] svg{fill:var(--leaf-soft)}

/* 단어장 */
.deck{display:flex;flex-direction:column;gap:10px}
.deck.on{border:var(--bw) solid var(--stroke);box-shadow:0 4px 0 var(--stroke)}
.deck h3{font-size:18px;overflow-wrap:anywhere}
.drop{border:var(--bw) dashed var(--stroke);border-radius:var(--r);padding:18px;text-align:center;display:block;cursor:pointer;background:var(--sun-soft)}
.drop b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block}
.wlist{display:flex;flex-direction:column}
.wlist>div{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.wlist .w{font-family:var(--f-word);font-weight:800;min-width:0;overflow-wrap:anywhere}
.wlist .m{color:var(--muted);font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere}

/* 학습 화면 */
.ses{flex:1;display:flex;flex-direction:column;min-height:100dvh;padding-top:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.ses-top{display:flex;align-items:center;gap:12px;height:44px}
.ses-top .x{width:40px;height:40px;border-radius:50%;font-size:20px;color:var(--muted);flex:none}
.ses-top .xpbar{flex:1;height:16px;border:2px solid var(--stroke)}
.ses-body{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.ses-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.qlabel{font-family:var(--f-display);font-size:17px;color:var(--muted)}
.prompt{background:var(--surface);border:var(--bw) solid var(--stroke);border-radius:var(--r);padding:22px 16px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.prompt .word{font-family:var(--f-word);font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1.15;overflow-wrap:anywhere}
.prompt .mean{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.prompt .ex{font-family:var(--f-word);font-weight:700;font-size:19px;line-height:1.45}
.prompt .exk{color:var(--muted);font-size:14px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--stroke);color:var(--leaf-text)}
.spk{width:52px;height:52px;border-radius:50%;background:var(--sky-soft);color:var(--sky-text);border:2px solid var(--stroke);display:grid;place-items:center;flex:none}
.spk svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.spk.big{width:96px;height:96px;border-width:var(--bw);box-shadow:0 4px 0 var(--stroke)}.spk.big svg{width:46px;height:46px}
.spk.mini{width:34px;height:34px;border-width:1.5px}.spk.mini svg{width:18px;height:18px}
.newtag{font-family:var(--f-display);background:var(--sun);color:var(--on-sun);border:2px solid var(--stroke);border-radius:99px;padding:2px 12px;font-size:14px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{min-height:56px;padding:10px 18px;border-radius:20px;background:var(--surface);border:var(--bw) solid var(--stroke);box-shadow:0 3px 0 var(--stroke);
  font-size:17px;font-weight:700;text-align:left;overflow-wrap:anywhere}
.choice.en{font-family:var(--f-word);font-weight:800;font-size:19px}
.choice:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stroke)}
.choice.ok{background:var(--leaf)} .choice.ok{color:var(--on-leaf)}
.choice.no{background:var(--berry);color:#4D2630}
.choices.done .choice{pointer-events:none}
.choices.done .choice:not(.ok):not(.no){opacity:.45}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:54px}
.slot{width:min(38px,calc((100% - (var(--n) - 1) * 6px) / var(--n)));height:48px;padding:0;border-radius:12px;border:2px dashed var(--muted);display:grid;place-items:center;font-family:var(--f-word);font-weight:900;font-size:22px}
.slot.fill{border:2px solid var(--stroke);background:var(--leaf);color:var(--on-leaf)}
.slot.gap{border:0;width:14px}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.tile{width:42px;height:52px;border-radius:14px;background:var(--surface);border:var(--bw) solid var(--stroke);box-shadow:0 3px 0 var(--stroke);
  font-family:var(--f-word);font-weight:900;font-size:22px}
.tile.used{visibility:hidden}
.typein{width:100%;height:60px;border-radius:20px;border:var(--bw) solid var(--stroke);background:var(--surface);padding:0 16px;
  font-family:var(--f-word);font-weight:800;font-size:24px;text-align:center}
.typein:focus{outline:none;background:var(--sun-soft)}
.fb{border-radius:var(--r);padding:10px 14px;display:flex;align-items:center;gap:12px;border:var(--bw) solid var(--stroke)}
.fb>div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--berry-soft)}
.fb b{font-family:var(--f-display);font-weight:400;font-size:20px}
.fb .ans{font-weight:700}
.fb .ans em{font-style:normal;font-family:var(--f-word);font-weight:900;font-size:19px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

/* 결과 */
.result{align-items:center;text-align:center;justify-content:center;gap:14px}
.result h1{font-size:30px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat3 div{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 4px}
.stat3 b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}
.stat3 span{font-size:12px;color:var(--muted)}
.gain{background:var(--sun-soft);border:2px solid var(--stroke);border-radius:18px;padding:10px 14px;width:100%;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* 대결 */
.duel-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.duel-row .bar{height:22px;border-radius:99px;background:var(--sunken);overflow:hidden;border:2px solid var(--stroke)}
.duel-row .bar i{display:block;height:100%;background:var(--sky);min-width:6px;transition:width .6s}
.duel-row.me .bar i{background:var(--leaf)}
.duel-row b{font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:15px}
table.cmp th,table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
table.cmp th:first-child,table.cmp td:first-child{text-align:left;color:var(--muted);font-weight:400}

/* 게임 */
.gamecard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:var(--bw) solid var(--stroke);box-shadow:0 4px 0 var(--stroke)}
.gamecard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--stroke)}
.gamecard .e{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none;background:var(--sky-soft)}
.gamecard.b .e{background:var(--sun-soft)}
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;align-content:start}
.mcard{min-height:74px;border-radius:18px;background:var(--surface);border:var(--bw) solid var(--stroke);box-shadow:0 3px 0 var(--stroke);padding:6px;
  font-weight:700;font-size:14px;overflow-wrap:anywhere;line-height:1.25}
.mcard.en{font-family:var(--f-word);font-weight:800;font-size:16px;background:var(--lilac-soft)}
.mcard.sel{background:var(--sun)}
.mcard.sel,.mcard.sel.en{color:var(--on-sun)}
.mcard.gone{visibility:hidden}

/* 내 정보 */
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--sunken);border-radius:18px;padding:10px 2px;text-align:center;font-size:11px;line-height:1.3;border:2px solid transparent}
.badge .e{font-size:28px;display:block;filter:grayscale(1);opacity:.35}
.badge.on{background:var(--sun-soft);border-color:var(--stroke)} .badge.on .e{filter:none;opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.cal i.l1{background:var(--leaf-soft);color:var(--leaf-text)} .cal i.l2{background:var(--leaf);color:var(--on-leaf);border:2px solid var(--stroke)}
.cal i.t{outline:2px solid var(--sun);outline-offset:1px}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set>span{flex:1}
select,.inp{height:46px;border-radius:16px;border:2px solid var(--stroke);background:var(--surface);padding:0 14px;font-size:16px}
.inp{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;height:40px;padding:0 12px;border-radius:99px;border:2px solid var(--line);font-weight:700;background:var(--surface)}
.seg button.on{background:var(--leaf);border-color:var(--stroke);color:var(--on-leaf)}

/* 시트/토스트 */
.sheet-bg{position:fixed;inset:0;background:rgba(40,25,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:86dvh;overflow:auto;border-radius:28px 28px 0 0;border-top:var(--bw) solid var(--stroke);
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{font-size:21px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;max-width:86vw;text-align:center}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.syncdot.ok{background:var(--leaf-text)} .syncdot.err{background:var(--berry-text)} .syncdot.busy{background:var(--sun)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div id="toast" hidden></div>
<canvas id="confetti" hidden></canvas>
<script>
'use strict';
/* ================= 기본 도구 ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 6e4) / 864e5); };
const iso = n => new Date(n * 864e5).toISOString().slice(0, 10);
const weekStart = d => d - ((new Date(d * 864e5).getUTCDay() + 6) % 7);
const md = n => { const d = new Date(n * 864e5); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };

/* ---- 홈 ---- */
function viewHome() {
  const p = P(), c = counts(p), lv = levelOf(p.xp), base = levelBase(lv), nextB = levelBase(lv + 1), t = today();
  const todayXP = p.days[t] || 0, pct = Math.min(100, Math.round(todayXP / S.cfg.goal * 100)), streak = effStreak(p), doneToday = p.lastDay === t;
  const deck = D[S.curDeck], pl = plan('learn'), h = new Date().getHours();
  const hello = h < 11 ? '좋은 아침이에요' : h < 18 ? '오늘도 반가워요' : '오늘 하루 수고했어요';
  const box = (head, line, btns, mood) => `<section class="card today"><div class="row" style="align-items:flex-start"><div class="grow" style="flex:1;min-width:0">${head}</div><div class="bob">${buddy(mood || 'hi', 84)}</div></div><p class="say">${line}</p>${btns}</section>`;
  let todayCard;
  if (!Object.keys(D).length) {
    todayCard = box('<h2>먼저 단어장을 올려 주세요</h2>', '엑셀 파일을 올리면 바로 같이 시작할 수 있어요.', '<button class="btn sun" data-a="tab" data-t="decks">단어장 올리러 가기</button>');
  } else if (!pl.rev.length && !pl.news.length) {
    const tomorrow = Object.keys(p.prog).reduce((n, dn) => n + Object.values(p.prog[dn]).filter(e => e[1] === t + 1 && D[dn]).length, 0);
    const more = Object.values(D).some(d => deckStat(p, d).left);
    todayCard = box(`<h2>${deck ? '이 단어장을 모두 심었어요' : '단어장을 골라 주세요'}</h2>`, tomorrow ? `내일 복습할 단어 ${tomorrow}개가 기다리고 있어요.` : '다른 단어장을 골라 새 단어를 심어 봐요.',
      `<button class="btn sun" data-a="tab" data-t="${tomorrow ? 'games' : 'decks'}">${tomorrow ? '미니게임 하러 가기' : '단어장 고르기'}</button>${tomorrow && more ? '<button class="link" data-a="tab" data-t="decks">다른 단어장으로 새 단어 배우기</button>' : ''}`, 'yay');
  } else {
    const mins = Math.max(2, Math.round((pl.rev.length + pl.news.length * 5) * .22));
    const lines = doneToday ? ['오늘도 해냈어요! 조금 더 해도 좋아요.', '오늘 물 주기 끝! 정말 잘했어요.'] : pl.rev.length ? [`복습할 단어 ${pl.rev.length}개가 물을 기다려요.`] : streak >= 2 ? [`${streak}일째 함께하고 있어요. 오늘도 가 볼까요?`] : ['오늘도 같이 단어를 심어요!', '10분만 같이 해요. 금방 끝나요!'];
    todayCard = box(`<p class="deckname">${esc(deck ? deck.name : '복습')}</p><h2>${doneToday ? '한 번 더 해 볼까요?' : '오늘의 학습'}</h2>
      <div class="plan">${pl.rev.length ? `<span>복습 ${pl.rev.length}개</span>` : ''}${pl.news.length ? `<span>새 단어 ${pl.news.length}개</span>` : ''}<span>약 ${mins}분</span></div>`, lines[t % lines.length],
      `<button class="btn sun" data-a="start" data-m="learn">${doneToday ? '이어서 학습하기' : '학습 시작'}</button>${pl.rev.length && pl.news.length ? '<button class="link" data-a="start" data-m="review">복습만 하기</button>' : ''}`, doneToday ? 'yay' : 'hi');
  }
  const rv = rivals(), wkIso = iso(weekStart(t)), myW = p.weeks[weekStart(t)] || 0;
  let duel = '';
  if (rv.length) {
    const top = rv.map(r => ({ r, xp: r.weekKey === wkIso ? r.weekXp : 0 })).sort((a, b) => b.xp - a.xp)[0], diff = myW - top.xp;
    const msg = diff > 0 ? `${esc(top.r.name)}보다 ${diff} XP 앞서고 있어요` : diff < 0 ? `${esc(top.r.name)}에게 ${-diff} XP 뒤지고 있어요` : `${esc(top.r.name)}와 동점이에요`;
    duel = `<button class="card row" data-a="tab" data-t="duel" style="text-align:left;width:100%">${avatar(p.avatar, '', p.id)}<span class="grow"><b class="disp" style="font-size:17px">이번 주 대결</b><br><span class="small muted">${msg}</span></span><span class="num" style="font-weight:800">${myW} : ${top.xp}</span>${avatar(top.r.avatar)}</button>`;
  }
  return `<header class="top">${avatar(p.avatar, '', p.id)}
      <div class="grow" style="min-width:0;flex:1"><div class="small muted">${hello}</div><h1 style="font-size:22px;line-height:1.2">${esc(p.name)}</h1></div>
      <span class="chip fire" title="연속 학습일">🔥 ${streak}일</span>${p.shields ? `<span class="chip sky" title="하루 빠져도 연속 기록을 지켜 줘요">🛡️ ${p.shields}</span>` : ''}</header>
    <section class="card row"><div class="grow stack" style="gap:6px;flex:1;min-width:0">
        <div class="row" style="justify-content:space-between"><b class="disp" style="font-size:17px">Lv.${lv} ${titleOf(lv)}</b><span class="small muted num">${p.xp - base} / ${nextB - base} XP</span></div>
        <div class="xpbar"><i style="width:${Math.round((p.xp - base) / (nextB - base) * 100)}%"></i></div>
        <span class="small muted">오늘 ${todayXP} XP · 목표 ${S.cfg.goal} XP</span></div>
      <div class="ring" style="--p:${pct}" role="img" aria-label="오늘 목표 ${pct}% 달성"><span>${pct >= 100 ? '완료' : pct + '%'}</span></div></section>
    ${todayCard}${duel}
    <h2 class="section-title">내 정원 <span class="small muted" style="font-family:var(--f-body)">단어 ${c.learned}개${c.due ? ` · 복습 대기 ${c.due}개` : ''}</span></h2>
    <section class="garden" aria-label="단어 성장 단계">${[1, 2, 3, 4, 5, 6].map(i => `<div><span class="e">${STAGE[i].e}</span><b>${c.stage[i]}</b><span>${STAGE[i].n}</span></div>`).join('')}</section>
    <p class="small muted">복습에서 맞힐 때마다 한 단계씩 자라요. 씨앗은 1일, 새싹은 3일, 줄기는 7일, 꽃은 14일, 나무는 30일 뒤에 다시 만나요.</p>`;
}

/* ---- 대결 ---- */
function viewDuel() {
  const p = P(), t = today(), wk = weekStart(t), wkIso = iso(wk), rv = rivals();
  if (!rv.length) {
    return `<h1 style="font-size:26px">주간 대결</h1><section class="card stack center"><div style="display:grid;place-items:center" class="bob">${buddy('hi', 96)}</div><h2>아직 대결 상대가 없어요</h2>
      <p class="muted">${S.cfg.gas ? '형제자매가 자기 기기에서 같은 연결 코드를 입력하고 학습을 시작하면 여기에 나타나요.' : '내 정보 탭에서 가족 연결을 하면, 형제자매와 이번 주 XP로 대결할 수 있어요.'}</p>
      <button class="btn" data-a="tab" data-t="me">${S.cfg.gas ? '연결 상태 보기' : '가족 연결하러 가기'}</button></section>`;
  }
  const all = [{ me: true, name: p.name, avatar: p.avatar, xp: p.weeks[wk] || 0, s: summary(p) }].concat(rv.map(r => ({ name: r.name, avatar: r.avatar, xp: r.weekKey === wkIso ? r.weekXp : 0, s: r }))).sort((a, b) => b.xp - a.xp);
  const max = Math.max(1, ...all.map(a => a.xp)), left = 6 - (t - wk), me = all.find(a => a.me), lead = all[0];
  const msg = lead.me ? (all[1].xp === lead.xp ? '지금은 동점이에요. 한 번만 더 학습하면 앞서 나가요.' : `1등이에요! ${esc(all[1].name)}보다 ${lead.xp - all[1].xp} XP 앞서 있어요.`) : `${esc(lead.name)}에게 ${lead.xp - me.xp} XP 뒤져 있어요. 학습 ${Math.max(1, Math.ceil((lead.xp - me.xp) / 300))}번이면 따라잡을 수 있어요.`;
  const hist = duelHistory(), wins = {}; hist.forEach(h => { if (h.winner) wins[h.winner] = (wins[h.winner] || 0) + 1; });
  const cols = all.map(a => a.s);
  return `<h1 style="font-size:26px">주간 대결</h1>
    <section class="card stack"><div class="row"><h2 class="grow" style="flex:1">${md(wk)} ~ ${md(wk + 6)}</h2><span class="chip">${left ? left + '일 남음' : '오늘 마감'}</span></div>
      ${all.map(a => `<div class="duel-row ${a.me ? 'me' : ''}">${avatar(a.avatar, '', a.me ? p.id : null)}<div class="stack" style="gap:4px;min-width:0"><span class="small"><b>${esc(a.name)}</b>${a.me ? ' (나)' : ''}</span><div class="bar"><i style="width:${Math.round(a.xp / max * 100)}%"></i></div></div><b>${a.xp} XP</b></div>`).join('')}
      <p class="small muted">${msg}</p></section>
    <p class="small muted">이번 주에 얻은 XP로 겨뤄요. 각자 자기 단어장으로 학습하기 때문에 학년이 달라도 공평해요. 매주 월요일에 새로 시작해요.</p>
    <h2 class="section-title">서로 비교</h2>
    <section class="card" style="overflow-x:auto"><table class="cmp"><tr><th></th>${cols.map(s => `<th>${esc(s.name)}</th>`).join('')}</tr>
      ${[['레벨', s => s.level], ['연속 학습', s => s.streak + '일'], ['심은 단어', s => s.learned], ['마스터', s => s.mastered], ['정답률', s => s.acc + '%'], ['주간 우승', s => (wins[s.id] || 0) + '회']].map(r => `<tr><td>${r[0]}</td>${cols.map(s => `<td class="num">${r[1](s)}</td>`).join('')}</tr>`).join('')}</table></section>
    ${hist.length ? `<h2 class="section-title">지난 대결</h2><section class="card stack">${hist.slice(0, 8).map(h => `<div class="row small"><span class="muted num" style="min-width:86px">${h.week.slice(5).replace('-', '/')} 주</span><span class="grow" style="flex:1">${h.list.map(x => `${esc(x.name)} ${x.xp}`).join(' · ')}</span><b>${h.winner ? '👑 ' + esc(h.list[0].name) : '무승부'}</b></div>`).join('')}</section>` : ''}`;
}

/* ---- 내 정보 ---- */
function viewMe() {
  const p = P(), t = today(), c = counts(p), lv = levelOf(p.xp);
  const cal = []; const start = weekStart(t) - 21;

function viewSession() {

    else if (c.type === 'cloze') prompt = `<div class="ex">${esc(v.cz.before)}<span class="blank">${fb ? esc(answerOf(it.r[0])) : '&nbsp;'}</span>${esc(v.cz.after)}</div>${it.r[3] ? `<div class="exk">${esc(it.r[3])}</div>` : `<div class="exk">${esc(it.r[1])}</div>`}`;

    } else if (c.type === 'tiles') {

        <div class="tiles">${v.pool.map((t, i) => `<button class="tile ${t.used ? 'used' : ''}" data-a="tile" data-i="${i}" ${fb ? 'disabled' : ''}>${esc(t.ch)}</button>`).join('')}</div>`;
    } else if (c.type === 'type') {

        ${fb ? '' : `<div class="row"><button type="button" class="btn ghost sm" data-a="hint" ${c.hint ? 'disabled' : ''}>첫 글자 보기</button><button class="btn sm grow" style="flex:1" type="submit">확인</button></div>`}</form>`;
    }

/* ================= 효과 ================= */
let confOn = false;
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#10994C', '#FFC22E', '#2B7DE9', '#E8484F', '#7BD89B'];
  const ps = Array.from({ length: 70 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 3, s: 5 + Math.random() * 6, c: pick(cols), r: Math.random() * 6 }));
  cv.hidden = false; confOn = true; let f = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (confOn && ++f < 110) requestAnimationFrame(step); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; confOn = false; }
  })();
}

  toast('연결하는 중…');
  try { await api({ a: 'ping' }, url); } catch (e) { toast('연결하지 못했어요. 코드를 다시 확인해 주세요'); return false; }
  S.cfg.gas = url; S.cloud = {}; save(); return true;
}

      D[name] = { name, words: d.words, ver: null, local: true }; if (!S.curDeck || !D[S.curDeck]) S.curDeck = name;
    });
    const n = pendingDecks.length; pendingDecks = null; save(); saveDecks(); closeModal(); render(); toast(`단어장 ${n}개를 추가했어요`); sync();
  },
  badge(el) { const b = BADGES.find(x => x.id === el.dataset.id), got = P().badges[b.id]; toast(`${b.e} ${b.n}: ${b.d}${got ? ' (' + md(got) + ' 획득)' : ''}`); },
  cfg(el) { const k = el.dataset.k, v = +el.dataset.v; S.cfg[k] = (k === 'sfx' || k === 'auto') ? !!v : v; save(); render(); },
  async connect() { if (await connectTo($('#gas').value)) { render(); toast('연결했어요. 동기화를 시작해요'); sync(); } },
  syncNow() { sync().then(ok => toast(ok ? '동기화를 마쳤어요' : '동기화하지 못했어요')); render(); },
  disconnect() { openModal(`<h2>가족 연결을 끊을까요?</h2><p class="muted">이 기기의 기록은 그대로 남고, 구글 시트와 주고받는 것만 멈춰요.</p><button class="btn danger" data-a="doDisconnect">연결 끊기</button><button class="btn ghost" data-a="closeModal">취소</button>`); },
  doDisconnect() { S.cfg.gas = ''; S.cloud = {}; Object.values(D).forEach(d => { d.local = true; d.ver = null; }); save(); saveDecks(); closeModal(); render(); },
  switch(el) { S.cur = el.dataset.id; save(); tab = 'home'; render(); sync(); },
  addProfile() { S.cur = null; ob = { avatar: '토리', grade: '초6', mode: 'new', list: null }; render(); },
  askDelProfile() { openModal(`<h2>프로필을 삭제할까요?</h2><p class="muted"><b>${esc(P().name)}</b>의 학습 기록, 배지, XP가 모두 사라지고 되돌릴 수 없어요.</p><button class="btn danger" data-a="delProfile">삭제하기</button><button class="btn ghost" data-a="closeModal">취소</button>`); },
  async delProfile() {
    const id = S.cur; closeModal();
    if (S.cfg.gas) { try { await api({ a: 'delProfile', id }); } catch (e) { } }
    try { localStorage.removeItem(KI + id); } catch (e) { } delete IMG[id];
    delete S.profiles[id]; S.cur = Object.keys(S.profiles)[0] || null; save(); render();
  },
  closeModal() { closeModal(); },
  closeModalBg(el, ev) { if (ev.target === el) closeModal(); }
};
function keepName() { const v = ($('#ob-name') || {}).value || ''; render(); const el = $('#ob-name'); if (el) el.value = v; }

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) fn(el, ev);
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id !== 'typeform' || !ses || ses.fb) return;
  const c = ses.q[ses.i], el = $('#typein'), typed = el.value, w = c.it.r[0];
  if (!typed.trim()) { el.focus(); return; }
  const alts = String(w).replace(/\(.*?\)/g, ' ').split(/[\/,;]/).map(norm).filter(Boolean);
  const ok = alts.includes(norm(typed)) || norm(typed) === norm(w);
  answer(ok); ses.fb.typed = typed; render();
});
document.addEventListener('change', async ev => {
  if (ev.target.id === 'palimg') { const f = ev.target.files && ev.target.files[0]; ev.target.value = ''; if (f) setPalImage(f); return; }
  if (ev.target.id !== 'file') return;
  const files = Array.from(ev.target.files || []); ev.target.value = ''; if (!files.length) return;
  toast('파일을 읽는 중…');
  const out = [];
  for (const f of files) { try { out.push(...await parseFile(f)); } catch (e) { toast(f.name + ' 파일을 읽지 못했어요'); } }
  if (!out.length) { toast('단어를 찾지 못했어요. A열에 단어, B열에 뜻이 있는지 확인해 주세요'); return; }
  pendingDecks = out; openModal(sheetPreview());
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && P() && !ses && !game) { if (Date.now() - (S.cloud.at || 0) > 3e5) sync(); softRender(); } });
if (canSpeak()) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { voice = null; pickVoice(); }; } catch (e) { } }

/* ================= 시작 ================= */
(function boot() {
  Object.values(S.profiles).forEach(p => { fixProfile(p); try { const d = localStorage.getItem(KI + p.id); if (d) IMG[p.id] = d; } catch (e) { } });
  if (S.cur && !S.profiles[S.cur]) S.cur = Object.keys(S.profiles)[0] || null;
  const m = location.hash.match(/connect=([^&]+)/);
  if (m) { try { const u = decodeURIComponent(m[1]); if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) && !S.cfg.gas) { S.cfg.gas = u; save(); } } catch (e) { } history.replaceState(null, '', location.pathname + location.search); }
  if (!D[S.curDeck]) S.curDeck = Object.keys(D)[0] || null;
  render();
  if (P()) sync();
})();
</script>
</body>
